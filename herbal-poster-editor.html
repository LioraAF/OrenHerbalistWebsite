<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>עורך דפי מוצר | אורן הרבליסט</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #273427;
      --moss: #526449;
      --paper: #e9dec2;
      --panel: #f6f2e8;
      --line: #c9bea5;
      --accent: #7b4f32;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(255,255,255,.72), transparent 24rem),
        #d8d0be;
      font-family: Arial, "Noto Sans Hebrew", sans-serif;
    }

    button, input, textarea { font: inherit; }

    .app {
      display: grid;
      grid-template-columns: minmax(290px, 370px) minmax(0, 1fr);
      min-height: 100vh;
      direction: ltr;
    }

    .controls {
      direction: rtl;
      padding: 24px;
      background: rgba(246,242,232,.97);
      border-left: 1px solid var(--line);
      box-shadow: 8px 0 30px rgba(48,39,23,.08);
      overflow-y: auto;
      z-index: 2;
    }

    .controls h1 {
      margin: 0 0 6px;
      font: 700 27px/1.2 Georgia, "Times New Roman", serif;
    }

    .intro {
      margin: 0 0 20px;
      color: #5d6157;
      font-size: 14px;
      line-height: 1.55;
    }

    .field {
      display: grid;
      gap: 6px;
      margin: 0 0 14px;
    }

    .field label,
    .group-title {
      font-size: 13px;
      font-weight: 700;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 9px 10px;
      color: var(--ink);
      background: #fffefa;
      border: 1px solid #cfc6b3;
      border-radius: 7px;
      outline: none;
    }

    .field textarea {
      min-height: 72px;
      resize: vertical;
      line-height: 1.45;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--moss);
      box-shadow: 0 0 0 3px rgba(82,100,73,.12);
    }

    details {
      margin: 0 0 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255,255,255,.42);
    }

    summary {
      padding: 11px 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .plant-fields {
      padding: 0 12px 4px;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 18px;
    }

    button {
      min-height: 42px;
      padding: 8px 12px;
      color: white;
      background: var(--moss);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    button.secondary {
      color: var(--ink);
      background: #ded5c1;
    }

    button:hover { filter: brightness(.95); }

    .tip {
      margin: 15px 0 0;
      padding: 10px 12px;
      color: #5b584f;
      background: #ebe4d5;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
    }

    .stage {
      display: grid;
      place-items: start center;
      min-width: 0;
      padding: 32px;
      overflow: auto;
    }

    .poster-shell {
      width: min(780px, 100%);
      filter: drop-shadow(0 22px 28px rgba(50,40,24,.22));
    }

    #poster {
      display: block;
      width: 100%;
      height: auto;
      background: var(--paper);
      user-select: none;
      touch-action: none;
    }

    .movable { cursor: grab; }
    .movable:active { cursor: grabbing; }
    .movable.selected > .selection-ring { opacity: 1; }
    .selection-ring {
      opacity: 0;
      fill: none;
      stroke: #8d603f;
      stroke-width: 3;
      stroke-dasharray: 10 9;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .poster-title {
      font-family: Georgia, "Times New Roman", "Noto Serif Hebrew", serif;
      font-weight: 700;
      fill: #34391f;
      letter-spacing: 2px;
      paint-order: stroke;
      stroke: rgba(52,57,31,.16);
      stroke-width: 1.2px;
    }

    .poster-subtitle,
    .plant-name,
    .plant-description,
    .footer-note {
      font-family: Arial, "Noto Sans Hebrew", sans-serif;
      fill: #344235;
    }

    .plant-name {
      font-family: Georgia, "Times New Roman", "Noto Serif Hebrew", serif;
      font-weight: 700;
      fill: #414927;
      letter-spacing: 1px;
    }

    .plant-latin {
      font: italic 22px Georgia, "Times New Roman", serif;
      fill: #6e654e;
    }

    .sketch {
      fill: none;
      stroke: #40583f;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sketch-thin {
      fill: none;
      stroke: #526950;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .wash-purple { fill: #82718a; opacity: .45; }
    .wash-yellow { fill: #b99634; opacity: .55; }
    .wash-brown { fill: #805940; opacity: .48; }

    .archive-rule {
      fill: none;
      stroke: #57492f;
      stroke-width: 3;
      stroke-linecap: round;
      opacity: .84;
    }

    .field-note {
      font: italic 24px/1.25 "Bradley Hand", "Segoe Print", cursive;
      fill: #514936;
      opacity: .9;
    }

    .section-label {
      font: 700 26px Georgia, "Times New Roman", "Noto Serif Hebrew", serif;
      fill: #414927;
      letter-spacing: 1px;
    }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .controls {
        border-left: 0;
        border-bottom: 1px solid var(--line);
      }
      .stage { padding: 18px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="controls">
      <h1>עורך דף מוצר</h1>
      <p class="intro">ערכו את המלל, ואז גררו כל אזור ישירות על גבי הדף. אפשר לשמור את העבודה ולהמשיך מאוחר יותר.</p>

      <div class="field">
        <label for="titleInput">שם המוצר</label>
        <input id="titleInput" value="משחת עזרה ראשונה">
      </div>

      <div class="field">
        <label for="subtitleInput">שורת הסבר</label>
        <textarea id="subtitleInput">רקיחה צמחית לשימוש חיצוני, שנועדה לתמוך בעור ברגעים הקטנים של היום.</textarea>
      </div>

      <details open>
        <summary>לבנדר</summary>
        <div class="plant-fields">
          <div class="field">
            <label for="plant1Name">שם הצמח</label>
            <input id="plant1Name" value="לבנדר">
          </div>
          <div class="field">
            <label for="plant1Latin">שם לטיני / שורה קטנה</label>
            <input id="plant1Latin" value="Lavandula angustifolia">
          </div>
          <div class="field">
            <label for="plant1Description">איכויות הצמח במוצר</label>
            <textarea id="plant1Description">מרגיע את העור ומביא לרקיחה איכות עדינה, ארומטית ומאזנת.</textarea>
          </div>
        </div>
      </details>

      <details>
        <summary>שרף אורנים</summary>
        <div class="plant-fields">
          <div class="field">
            <label for="plant2Name">שם הצמח</label>
            <input id="plant2Name" value="שרף אורנים">
          </div>
          <div class="field">
            <label for="plant2Latin">שם לטיני / שורה קטנה</label>
            <input id="plant2Latin" value="Pinus spp.">
          </div>
          <div class="field">
            <label for="plant2Description">איכויות הצמח במוצר</label>
            <textarea id="plant2Description">שרף מסורתי בעל אופי מחמם, שומר ועוטף; מעניק למשחה גוף וניחוח יער.</textarea>
          </div>
        </div>
      </details>

      <details>
        <summary>היפריקום</summary>
        <div class="plant-fields">
          <div class="field">
            <label for="plant3Name">שם הצמח</label>
            <input id="plant3Name" value="היפריקום">
          </div>
          <div class="field">
            <label for="plant3Latin">שם לטיני / שורה קטנה</label>
            <input id="plant3Latin" value="Hypericum perforatum">
          </div>
          <div class="field">
            <label for="plant3Description">איכויות הצמח במוצר</label>
            <textarea id="plant3Description">השמן האדמדם שלו מזוהה עם טיפוח עור רגיש ותמיכה מקומית לאחר עומס.</textarea>
          </div>
        </div>
      </details>

      <div class="field">
        <label for="footerInput">הערה בתחתית הדף</label>
        <textarea id="footerInput">לשימוש חיצוני בלבד · המידע נועד להיכרות ואינו מחליף ייעוץ אישי</textarea>
      </div>

      <div class="button-row">
        <button id="downloadPng" type="button">הורדת PNG</button>
        <button id="downloadSvg" type="button">הורדת SVG</button>
        <button id="saveLayout" class="secondary" type="button">שמירת עבודה</button>
        <button id="loadLayout" class="secondary" type="button">טעינת עבודה</button>
        <button id="resetLayout" class="secondary" type="button">איפוס מיקום</button>
      </div>

      <p class="tip">טיפ: לחצו וגררו את הכותרת, ההסבר, כל אחד משלושת הצמחים או ההערה התחתונה. קובץ SVG נשאר חד ומתאים גם להדפסה.</p>
      <input id="loadFile" type="file" accept=".json,application/json" hidden>
    </aside>

    <section class="stage" aria-label="תצוגה מקדימה">
      <div class="poster-shell">
        <svg id="poster" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" role="img" aria-labelledby="posterA11yTitle">

          <defs>

              <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="4" seed="7" result="noise"/>
              <feColorMatrix in="noise" type="saturate" values="0" result="grayNoise"/>
              <feComponentTransfer in="grayNoise" result="faintNoise">
                <feFuncA type="table" tableValues="0 .10"/>

              <feBlend in="SourceGraphic" in2="faintNoise" mode="multiply"/>
            </filter>
            <filter id="roughen" x="-15%" y="-15%" width="130%" height="130%">

          <path d="M61 58C292 43 478 66 696 52C893 40 1046 64 1181 51M53 1692C275 1677 506 1704 735 1687C924 1674 1087 1700 1191 1684" class="archive-rule" opacity=".38"/>
          <path d="M58 66C39 380 65 705 47 1016C37 1258 57 1493 49 1677M1182 61C1200 390 1177 704 1193 1022C1204 1270 1184 1488 1190 1674" class="archive-rule" opacity=".33"/>

  </main>

  <script>
    const svg = document.getElementById("poster");
    const defaultPositions = {
      titleGroup: [650, 180],
      plant1Group: [255, 610],
      plant2Group: [285, 850],
      plant3Group: [250, 1095],
      footerGroup: [675, 1485]
    };

    const fieldMap = {
      titleInput: "posterTitle",
      plant1Name: "plant1NameText",
      plant1Latin: "plant1LatinText",
      plant2Name: "plant2NameText",
      plant2Latin: "plant2LatinText",
      plant3Name: "plant3NameText",
      plant3Latin: "plant3LatinText"
    };

    const wrapMap = {
      subtitleInput: { id: "posterSubtitle", width: 790, lineHeight: 37, maxLines: 2 },
      plant1Description: { id: "plant1DescriptionText", width: 395, lineHeight: 34, maxLines: 4 },
      plant2Description: { id: "plant2DescriptionText", width: 395, lineHeight: 34, maxLines: 4 },
      plant3Description: { id: "plant3DescriptionText", width: 395, lineHeight: 34, maxLines: 4 },
      footerInput: { id: "footerText", width: 790, lineHeight: 31, maxLines: 3 }
    };

    function setSimpleText(inputId, textId) {
      document.getElementById(textId).textContent = document.getElementById(inputId).value;
    }

    function wrapSvgText(inputId, config) {
      const input = document.getElementById(inputId);
      const textEl = document.getElementById(config.id);
      const words = input.value.trim().split(/\s+/).filter(Boolean);
      const originalY = Number(textEl.getAttribute("y") || 0);
      textEl.textContent = "";

      let line = [];
      let lineNumber = 0;
      let tspan = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
      tspan.setAttribute("x", textEl.getAttribute("x") || 0);
      tspan.setAttribute("y", originalY);
      textEl.appendChild(tspan);

      for (const word of words) {
        line.push(word);
        tspan.textContent = line.join(" ");
        if (tspan.getComputedTextLength() > config.width && line.length > 1) {
          line.pop();
          tspan.textContent = line.join(" ");
          lineNumber += 1;
          if (lineNumber >= config.maxLines) break;
          line = [word];
          tspan = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
          tspan.setAttribute("x", textEl.getAttribute("x") || 0);
          tspan.setAttribute("dy", config.lineHeight);
          tspan.textContent = word;
          textEl.appendChild(tspan);
        }
      }
    }

    function refreshText() {
      Object.entries(fieldMap).forEach(([inputId, textId]) => setSimpleText(inputId, textId));
      Object.entries(wrapMap).forEach(([inputId, config]) => wrapSvgText(inputId, config));
    }

    document.querySelectorAll("input, textarea").forEach((input) => {
      if (input.type !== "file") input.addEventListener("input", refreshText);
    });

    let active = null;
    let pointerOffset = { x: 0, y: 0 };

    function clientToSvg(event) {
      const point = svg.createSVGPoint();
      point.x = event.clientX;
      point.y = event.clientY;
      return point.matrixTransform(svg.getScreenCTM().inverse());
    }

    svg.querySelectorAll(".movable").forEach((group) => {
      group.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        svg.querySelectorAll(".movable").forEach((item) => item.classList.remove("selected"));
        active = group;
        active.classList.add("selected");
        const point = clientToSvg(event);
        pointerOffset.x = point.x - Number(active.dataset.x);
        pointerOffset.y = point.y - Number(active.dataset.y);
        active.setPointerCapture(event.pointerId);
      });

      group.addEventListener("pointermove", (event) => {
        if (active !== group) return;
        const point = clientToSvg(event);
        const x = Math.max(40, Math.min(1200, point.x - pointerOffset.x));
        const y = Math.max(40, Math.min(1714, point.y - pointerOffset.y));
        active.dataset.x = x.toFixed(1);
        active.dataset.y = y.toFixed(1);
        active.setAttribute("transform", `translate(${x} ${y})`);
      });

      const finishDrag = () => { active = null; };
      group.addEventListener("pointerup", finishDrag);
      group.addEventListener("pointercancel", finishDrag);
    });

    function getState() {
      const fields = {};
      document.querySelectorAll(".controls input:not([type=file]), .controls textarea").forEach((field) => {
        fields[field.id] = field.value;
      });
      const positions = {};
      svg.querySelectorAll(".movable").forEach((group) => {
        positions[group.id] = [Number(group.dataset.x), Number(group.dataset.y)];
      });
      return { version: 1, fields, positions };
    }

    function applyState(state) {
      Object.entries(state.fields || {}).forEach(([id, value]) => {
        const field = document.getElementById(id);
        if (field) field.value = value;
      });
      Object.entries(state.positions || {}).forEach(([id, position]) => {
        const group = document.getElementById(id);
        if (!group || !Array.isArray(position)) return;
        group.dataset.x = position[0];
        group.dataset.y = position[1];
        group.setAttribute("transform", `translate(${position[0]} ${position[1]})`);
      });
      refreshText();
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function cleanSvgClone() {
      const clone = svg.cloneNode(true);
      clone.querySelectorAll(".movable").forEach((item) => item.classList.remove("selected"));
      clone.setAttribute("width", "1240");
      clone.setAttribute("height", "1754");
      const style = document.querySelector("style").textContent;
      const defs = clone.querySelector("defs");
      const styleNode = document.createElementNS("http://www.w3.org/2000/svg", "style");
      styleNode.textContent = style;
      defs.appendChild(styleNode);
      return new XMLSerializer().serializeToString(clone);
    }

    document.getElementById("downloadSvg").addEventListener("click", () => {
      const source = cleanSvgClone();
      downloadBlob(new Blob([source], { type: "image/svg+xml;charset=utf-8" }), "herbal-product-poster.svg");
    });

    document.getElementById("downloadPng").addEventListener("click", () => {
      const source = cleanSvgClone();
      const blob = new Blob([source], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const image = new Image();
      image.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = 1240;
        canvas.height = 1754;
        const context = canvas.getContext("2d");
        context.drawImage(image, 0, 0);
        canvas.toBlob((png) => downloadBlob(png, "herbal-product-poster.png"), "image/png");
        URL.revokeObjectURL(url);
      };
      image.src = url;
    });

    document.getElementById("saveLayout").addEventListener("click", () => {
      const json = JSON.stringify(getState(), null, 2);
      downloadBlob(new Blob([json], { type: "application/json" }), "herbal-product-poster-work.json");
    });

    document.getElementById("loadLayout").addEventListener("click", () => {
      document.getElementById("loadFile").click();
    });

    document.getElementById("loadFile").addEventListener("change", async (event) => {
      const [file] = event.target.files;
      if (!file) return;
      try {
        applyState(JSON.parse(await file.text()));
      } catch {
        alert("לא ניתן לקרוא את קובץ העבודה.");
      }
      event.target.value = "";
    });

    document.getElementById("resetLayout").addEventListener("click", () => {
      Object.entries(defaultPositions).forEach(([id, position]) => {
        const group = document.getElementById(id);
        group.dataset.x = position[0];
        group.dataset.y = position[1];
        group.setAttribute("transform", `translate(${position[0]} ${position[1]})`);
      });
    });

    refreshText();
  </script>
</body>
</html>
